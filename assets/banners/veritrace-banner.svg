<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Veritrace: separate signal from misinformation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B1D2A"/><stop offset="1" stop-color="#3E0F1B"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A2231"/><stop offset="1" stop-color="#4A1220"/></linearGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#E8DCC8" fill-opacity=".16"/></pattern>
    <clipPath id="card"><rect x="820" y="48" width="400" height="304" rx="6"/></clipPath>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#9E2A3A"/>
  <rect x="0" y="394" width="1280" height="6" fill="#9E2A3A"/>

  <!-- brand mark -->
  <g transform="translate(72 66)">
    <rect width="76" height="76" rx="18" fill="url(#badge)" stroke="#E8DCC8" stroke-opacity=".5"/>
    <path d="M19 20 L38 55 L57 20" fill="none" stroke="#F6EFE3" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="55" r="10.2" fill="#4A1220" stroke="#E8DCC8" stroke-width="2.8"/>
    <path d="M33.5 55.2 L36.8 58.5 L43 51.6" fill="none" stroke="#F6EFE3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="170" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#F6EFE3" letter-spacing="-1">Veritrace</text>
  <text x="172" y="142" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#E8DCC8" fill-opacity=".85" letter-spacing="5">MISINFORMATION INTELLIGENCE</text>

  <line x1="72" y1="176" x2="700" y2="176" stroke="#E8DCC8" stroke-opacity=".55" stroke-width="1"/>
  <line x1="72" y1="181" x2="700" y2="181" stroke="#E8DCC8" stroke-opacity=".3" stroke-width="1"/>

  <text x="72" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" fill="#F6EFE3">Separate signal from misinformation.</text>
  <text x="72" y="276" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#E8DCC8" fill-opacity=".92">Explainable fake-news analysis that combines NLP, machine learning,</text>
  <text x="72" y="302" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#E8DCC8" fill-opacity=".92">source credibility, FAISS retrieval and optional LLM reasoning.</text>

  <g font-family="'Courier New', monospace" font-size="13" font-weight="700">
    <rect x="72" y="326" width="112" height="28" rx="14" fill="none" stroke="#E8DCC8" stroke-opacity=".6"/><text x="128" y="345" text-anchor="middle" fill="#F6EFE3">TF-IDF + ML</text>
    <rect x="194" y="326" width="62" height="28" rx="14" fill="none" stroke="#E8DCC8" stroke-opacity=".6"/><text x="225" y="345" text-anchor="middle" fill="#F6EFE3">RAG</text>
    <rect x="266" y="326" width="148" height="28" rx="14" fill="none" stroke="#E8DCC8" stroke-opacity=".6"/><text x="340" y="345" text-anchor="middle" fill="#F6EFE3">Explainable AI</text>
    <rect x="424" y="326" width="146" height="28" rx="14" fill="none" stroke="#E8DCC8" stroke-opacity=".6"/><text x="497" y="345" text-anchor="middle" fill="#F6EFE3">FastAPI + React</text>
  </g>

  <!-- illustrative report card -->
  <g>
    <rect x="826" y="56" width="400" height="304" rx="6" fill="#000" fill-opacity=".25"/>
    <rect x="820" y="48" width="400" height="304" rx="6" fill="#FBF8F3"/>
    <g clip-path="url(#card)">
      <rect x="820" y="48" width="400" height="38" fill="#EFE4D2"/>
      <text x="840" y="72" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#6B1D2A" letter-spacing="2">ARTICLE VERDICT</text>
      <text x="1198" y="72" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#9E2A3A">ILLUSTRATIVE</text>
      <text x="840" y="120" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#4A1220">Likely misinformation</text>
      <!-- dial -->
      <g transform="translate(930 232)">
        <path d="M-72 0 A72 72 0 0 1 72 0" fill="none" stroke="#E8DCC8" stroke-width="16" stroke-linecap="round"/>
        <path d="M-72 0 A72 72 0 0 1 -45 -56" fill="none" stroke="#8B1E2D" stroke-width="16" stroke-linecap="round"/>
        <text y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#4A1220">24</text>
        <text y="18" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#6B1D2A" letter-spacing="1.5">CREDIBILITY /100</text>
      </g>
      <g font-family="'Courier New', monospace" font-size="11" fill="#2A2326">
        <text x="1040" y="160">Linguistic</text><rect x="1040" y="166" width="150" height="7" rx="3.5" fill="#E8DCC8"/><rect x="1040" y="166" width="38" height="7" rx="3.5" fill="#8B1E2D"/>
        <text x="1040" y="196">Source</text><rect x="1040" y="202" width="150" height="7" rx="3.5" fill="#E8DCC8"/><rect x="1040" y="202" width="20" height="7" rx="3.5" fill="#8B1E2D"/>
        <text x="1040" y="232">Evidence</text><rect x="1040" y="238" width="150" height="7" rx="3.5" fill="#E8DCC8"/><rect x="1040" y="238" width="30" height="7" rx="3.5" fill="#8B1E2D"/>
        <text x="1040" y="268">Restraint</text><rect x="1040" y="274" width="150" height="7" rx="3.5" fill="#E8DCC8"/><rect x="1040" y="274" width="46" height="7" rx="3.5" fill="#9E2A3A"/>
      </g>
      <line x1="840" y1="308" x2="1198" y2="308" stroke="#E8DCC8"/>
      <text x="840" y="334" font-family="'Courier New', monospace" font-size="11" fill="#6B1D2A">Claim 1 → Contradicted   ·   Claim 2 → Unverified</text>
    </g>
  </g>
</svg>
