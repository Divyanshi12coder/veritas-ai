# Full stack: PostgreSQL + API + web UI.   docker compose up --build   ->  http://localhost:8080
# Optional: create a .env next to this file to enable LLM reasoning (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veritrace
      POSTGRES_USER: veritrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veritrace_local_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritrace -d veritrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://veritrace:${POSTGRES_PASSWORD:-veritrace_local_dev}@db:5432/veritrace
      CORS_ORIGINS: http://localhost:8080
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
